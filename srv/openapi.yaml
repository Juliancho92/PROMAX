components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Planta:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        pais:
          type: string
        zonaHoraria:
          type: string
        activa:
          type: boolean
    Linea:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        planta:
          $ref: '#/components/schemas/Planta'
        activa:
          type: boolean
    CentroTrabajo:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        linea:
          $ref: '#/components/schemas/Linea'
        grupo:
          type: string
        divisionTiempo:
          type: string
        bodegaCT:
          type: string
        centroAnterior:
          $ref: '#/components/schemas/CentroTrabajo'
        activo:
          type: boolean
        s4_sync_status:
          type: string
          enum: [PENDING, OK, ERROR]
        s4_sync_ts:
          type: string
          format: date-time
        s4_guid:
          type: string
          format: uuid
    Turno:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        planta:
          $ref: '#/components/schemas/Planta'
        horaInicio:
          type: string
          format: time
        horaFin:
          type: string
          format: time
        diasAplicable:
          type: string
        activo:
          type: boolean
    UsuarioProfile:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
          enum: [Operario, Supervisor, Mantenimiento, Calidad, Admin]
        centros:
          type: array
          items:
            $ref: '#/components/schemas/CentroTrabajo'
    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioProfile'
        - type: object
          properties:
            telefono:
              type: string
            activo:
              type: boolean
            s4_sync_status:
              type: string
              enum: [PENDING, OK, ERROR]
            s4_sync_ts:
              type: string
              format: date-time
            s4_guid:
              type: string
              format: uuid
    UsuarioCreate:
      type: object
      required:
        - id
        - nombre
        - email
        - password
        - rol
      properties:
        id:
          type: string
          description: User ID (cedula)
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        rol:
          type: string
          enum: [Operario, Supervisor, Mantenimiento, Calidad, Admin]
        activo:
          type: boolean
          default: true
    UsuarioUpdate:
      type: object
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        rol:
          type: string
          enum: [Operario, Supervisor, Mantenimiento, Calidad, Admin]
        activo:
          type: boolean
    TipoActividad:
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
        esProductiva:
          type: boolean
        activo:
          type: boolean
    CodigoOperacion:
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        tipoActividad:
          $ref: '#/components/schemas/TipoActividad'
        centroTrabajo:
          $ref: '#/components/schemas/CentroTrabajo'
        activo:
          type: boolean
    OrdenProduccion:
      type: object
      properties:
        opPadre:
          type: string
        opNumero:
          type: string
        operacion:
          type: string
        itemOP:
          type: string
        itemOPRef:
          type: string
        itemOPResumen:
          type: string
        estado:
          type: string
          enum: [Aprobada, EnProceso, Completada, Cancelada, Borrador]
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
        fechaDocumento:
          type: string
          format: date-time
        cantEjecutar:
          type: number
          format: float
        cantPendiente:
          type: number
          format: float
        cantCompleta:
          type: number
          format: float
          default: 0
        cantRetrabajo:
          type: number
          format: float
          default: 0
        cantRechazos:
          type: number
          format: float
          default: 0
        centroTrabajo:
          $ref: '#/components/schemas/CentroTrabajo'
        bodega:
          type: string
        linea:
          $ref: '#/components/schemas/Linea'
        claseOP:
          type: string
          enum: [UNICA, COMPONENTE, RETRABAJO]
        opReferencial:
          type: string
        notas:
          type: string
        pesoEnKls:
          type: number
          format: float
        cantidadEjecutarKls:
          type: number
          format: float
        origenManual:
          type: boolean
          default: false
        s4_sync_status:
          type: string
          enum: [PENDING, OK, ERROR]
        s4_sync_ts:
          type: string
          format: date-time
        s4_guid:
          type: string
          format: uuid
        s4_error_msg:
          type: string
    OrdenProduccionStatus:
      type: object
      properties:
        opNumero:
          type: string
        operacion:
          type: string
        centroTrabajo:
          type: string
        estado:
          type: string
        operario:
          type: string
        horaInicio:
          type: string
          format: date-time
        duracionActual:
          type: integer
          description: Duration in seconds
    OperacionOrden:
      type: object
      properties:
        orden:
          $ref: '#/components/schemas/OrdenProduccion'
        numeroOperacion:
          type: integer
        codigoOperacion:
          $ref: '#/components/schemas/CodigoOperacion'
        centroTrabajo:
          $ref: '#/components/schemas/CentroTrabajo'
        cantPlaneada:
          type: number
          format: float
        cantCompleta:
          type: number
          format: float
          default: 0
        estado:
          type: string
          enum: [Pendiente, EnProceso, Completada, Saltada]
        s4_sync_status:
          type: string
          enum: [PENDING, OK, ERROR]
        s4_sync_ts:
          type: string
          format: date-time
        s4_guid:
          type: string
          format: uuid
    TipoParo:
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        tipo:
          type: string
          enum: [Planificado, NoPlanificado]
        tipohora:
          type: string
        categoria:
          type: string
        requiereMotivo:
          type: boolean
        color:
          type: string
          format: hex-color
        activo:
          type: boolean
    MotivoRechazo:
      type: object
      properties:
        id:
          type: string
        descripcion:
          type: string
        activo:
          type: boolean
    RegistroParo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registroProduccion:
          type: string
          format: uuid
        orden:
          $ref: '#/components/schemas/OrdenProduccion'
        centroTrabajo:
          $ref: '#/components/schemas/CentroTrabajo'
        operario:
          $ref: '#/components/schemas/UsuarioProfile'
        turno:
          $ref: '#/components/schemas/Turno'
        fecha:
          type: string
          format: date-time
        horaInicio:
          type: string
          format: date-time
        horaFin:
          type: string
          format: date-time
        duracionSeg:
          type: integer
        tipoParo:
          $ref: '#/components/schemas/TipoParo'
        codigoOperacion:
          $ref: '#/components/schemas/CodigoOperacion'
        motivoLibre:
          type: string
        esPlanificado:
          type: boolean
        autoDetectado:
          type: boolean
        sensorDataJson:
          type: string
        s4_sync_status:
          type: string
          enum: [PENDING, OK, ERROR]
        s4_sync_ts:
          type: string
          format: date-time
        s4_guid:
          type: string
          format: uuid
        s4_error_msg:
          type: string
        offline_id:
          type: string
        offline_ts:
          type: string
          format: date-time
    RegistroParoInput:
      type: object
      required:
        - ordenId
        - centroId
        - operarioId
        - turnoId
        - horaInicio
        - lote
        - tipoParoId
      properties:
        ordenId:
          type: string
        centroId:
          type: string
        operarioId:
          type: string
        turnoId:
          type: string
        lote:
          type: string
