  /sync/flush:
    post:
      summary: Trigger immediate synchronization of all pending offline data
      tags:
        - Sync
      responses:
        "200":
          description: Synchronization triggered
  /sync/retry:
    post:
      summary: Retry synchronization for specific pending items
      tags:
        - Sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: List of IDs of pending items to retry
      responses:
        "200":
          description: Retry initiated
  /sync/retry-all:
    post:
      summary: Retry synchronization for all filtered pending items
      tags:
        - Sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planta:
                  type: string
                linea:
                  type: array
                  items:
                    type: string
                centro:
                  type: array
                  items:
                    type: string
                turno:
                  type: string
                fechaRango:
                  type: array
                  items:
                    type: string
                    format: date
                  minItems: 2
                  maxItems: 2
                estadoSync:
                  type: array
                  items:
                    type: string
                    enum: [PENDING, ERROR]
                entityType:
                  type: array
                  items:
                    type: string
                    enum: [Produccion, Paros, Entregas, Rechazos, OrdenTrabajoMant, Inspeccion, NoConformidad, AndonEvent]
      responses:
        "200":
          description: Retry all initiated
