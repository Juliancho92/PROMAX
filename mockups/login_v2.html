
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMAX - Login</title>
    <style>
        :root {
            --promax-blue: #2A60A4; /* Azul oscuro del botón/texto */
            --promax-green: #6CBE45; /* Verde del logo */
            --input-background: rgba(255, 255, 255, 0.85); /* Fondo de input semi-transparente */
            --input-border: #bbbbbb;
            --text-color: #333333;
            --light-text-color: #ffffff; /* Para texto sobre fondo oscuro */
            --button-hover: #1f4a7a;
            --card-background: rgba(255, 255, 255, 0.1); /* Fondo de tarjeta muy sutil */
            --font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://via.placeholder.com/1920x1080/333333/dddddd?text=Fondo+Industrial'); /* Imagen de fondo placeholder */
            background-size: cover;
            background-position: center;
            color: var(--light-text-color);
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3); /* Capa oscura semi-transparente sobre el fondo */
            z-index: 0;
        }
        .login-container {
            background-color: var(--card-background);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px); /* Efecto de blur en el fondo del formulario */
        }
        .logo-promax {
            margin-bottom: 25px;
            font-size: 3.5em;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 0.8;
            color: var(--promax-blue);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            position: relative;
            display: inline-block;
        }
        .logo-promax::after {
            content: 'PMF';
            display: block;
            font-size: 0.35em;
            font-weight: 400;
            color: var(--light-text-color);
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .logo-promax .pro {
            color: var(--promax-blue);
        }
        .logo-promax .max {
            color: var(--promax-green);
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }
        .form-group label {
            display: none; /* Ocultar labels ya que los iconos los reemplazan visualmente */
        }
        .input-with-icon {
            display: flex;
            align-items: center;
            background-color: var(--input-background);
            border-radius: 8px;
            border: 1px solid var(--input-border);
            padding: 0 10px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-with-icon:focus-within {
            border-color: var(--promax-blue);
            box-shadow: 0 0 0 3px rgba(42, 96, 164, 0.2);
        }
        .input-with-icon .icon {
            color: var(--promax-blue);
            font-size: 1.5em;
            margin-right: 10px;
            display: flex;
            align-items: center;
        }
        input[type="text"],
        input[type="password"] {
            flex-grow: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 1.1em;
            color: var(--text-color);
            outline: none;
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #888888;
        }
        .password-toggle {
            cursor: pointer;
            color: #888888;
            font-size: 1.2em;
            padding: 5px;
        }
        .button {
            width: 100%;
            padding: 15px;
            background-color: var(--promax-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }
        .button:hover {
            background-color: var(--button-hover);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .footer-logos {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .footer-logo-text {
            font-size: 0.9em;
            color: var(--light-text-color);
            opacity: 0.8;
            line-height: 1.2;
        }
        .footer-logo-text strong {
            display: block;
            font-size: 1.1em;
            color: var(--promax-blue);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-promax">
            <span class="pro">Pro</span><span class="max">Max</span>
        </div>
        <form>
            <div class="form-group">
                <label for="cedula">Usuario</label>
                <div class="input-with-icon">
                    <span class="icon">👤</span>
                    <input type="text" id="cedula" name="cedula" placeholder="USUARIO" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-with-icon">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="CONTRASEÑA" required>
                    <span class="password-toggle">👁️</span>
                </div>
            </div>
            <button type="submit" class="button">Ingresar</button>
        </form>
        <div class="footer-logos">
            <div class="footer-logo-text">
                FN Tecnología<br>
                <strong>Tu aliado para crecer</strong>
            </div>
            <div class="footer-logo-text">
                <strong>Fanalca</strong>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.password-toggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈'; // Cambia el icono al alternar
        });
    </script>
</body>
</html>
